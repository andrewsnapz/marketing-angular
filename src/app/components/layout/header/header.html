<header class="header">
  <a tabindex="0" aria-label="Abstractly" href="#"><app-logo-svg /></a>
  <button
    (click)="this.openMobileNav()"
    class="open-navigation-button"
    appIconButton
    visuallyHiddenText="open navigation"
  >
    <app-hamburger-svg />
  </button>
</header>

<app-mobile-nav [isMobileNavOpen]="isMobileNavOpen()" [closeMobileNav]="this.closeMobileView" />
